<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página A - Acceso PQRS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .contenedor {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h1 { text-align: center; color: #333; margin-bottom: 24px; font-size: 22px; }
    h2 { color: #444; margin-bottom: 6px; font-size: 18px; }
    .subtitulo { color: #888; font-size: 13px; margin-bottom: 22px; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #1976d2; }
    .btn-ingresar {
      width: 100%;
      padding: 12px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .btn-ingresar:hover { background: #1565c0; }
    #menu { display: none; }
    .btn-rol {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: opacity 0.2s;
    }
    .btn-rol:hover { opacity: 0.85; }
    .btn-usuario   { background: #ff9800; color: white; }
    .btn-analista  { background: #4caf50; color: white; }
    .btn-encargado { background: #2196f3; color: white; }
    .btn-rol .icono { font-size: 22px; }
    .btn-rol .texto { display: flex; flex-direction: column; text-align: left; }
    .btn-rol .texto small { font-weight: normal; font-size: 11px; opacity: 0.85; }
    .error-msg {
      color: #e53935;
      font-size: 13px;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>
<div class="contenedor">
 
  <!-- STEP 1: Login página A -->
  <div id="registro">
    <h1>Acceso al sistema</h1>
    <input id="usuario"  type="text"     placeholder="Usuario o nombre">
    <input id="password" type="password" placeholder="Contraseña"
           onkeypress="if(event.key==='Enter') registrar()">
    <p class="error-msg" id="errorMsg"></p>
    <button class="btn-ingresar" onclick="registrar()">Ingresar</button>
  </div>
 
  <!-- STEP 2: Elegir rol -->
  <div id="menu">
    <h2 id="bienvenida"></h2>
    <p class="subtitulo">Selecciona con qué rol deseas ingresar al sistema PQRS:</p>
 
    <button class="btn-rol btn-usuario" onclick="irComoUsuario()">
      <span class="icono">👤</span>
      <span class="texto">
        Ingresar como Usuario
        <small>Crear y consultar mis PQRS</small>
      </span>
    </button>
 
    <button class="btn-rol btn-analista" onclick="irComoAnalistaDeNomina()">
      <span class="icono">🔍</span>
      <span class="texto">
        Ingresar como Analista – Nómina
        <small>Panel de gestión de solicitudes</small>
      </span>
    </button>
 
    <button class="btn-rol btn-encargado" onclick="irComoEncargado()">
      <span class="icono">⚙️</span>
      <span class="texto">
        Ingresar como Encargado
        <small>Panel de supervisión y cierre</small>
      </span>
    </button>
  </div>
 
</div>
</div>
<script src="script.js"></script>
</body>
</html>
