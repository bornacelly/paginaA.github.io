<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página A - Acceso PQRS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .contenedor {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h1 { text-align: center; color: #333; margin-bottom: 24px; }
    h2 { color: #555; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    .btn-registrar {
      width: 100%;
      padding: 12px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-registrar:hover { background: #1565c0; }

    /* Menú con los 3 botones */
    #menu { display: none; }
    #menu h2 { margin-bottom: 8px; }
    #menu p { color: #777; font-size: 13px; margin-bottom: 20px; }

    .btn-rol {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.2s;
    }
    .btn-rol:hover { opacity: 0.88; }
    .btn-usuario   { background: #ff9800; color: white; }
    .btn-analista  { background: #4caf50; color: white; }
    .btn-encargado { background: #2196f3; color: white; }

    .btn-rol .icono { font-size: 20px; }
    .btn-rol .texto { display: flex; flex-direction: column; text-align: left; }
    .btn-rol .texto small { font-weight: normal; font-size: 11px; opacity: 0.85; }
  </style>
</head>
<body>
<div class="contenedor">

  <!-- SECCIÓN REGISTRO/LOGIN DE PÁGINA A -->
  <div id="registro">
    <h1>Acceso al sistema</h1>
    <input id="usuario"  type="text"     placeholder="Usuario o nombre">
    <input id="password" type="password" placeholder="Contraseña">
    <button class="btn-registrar" onclick="registrar()">Ingresar</button>
  </div>

  <!-- MENÚ CON LOS 3 ROLES -->
  <div id="menu">
    <h2 id="bienvenida"></h2>
    <p>Selecciona con qué rol deseas ingresar al sistema PQRS:</p>

    <button class="btn-rol btn-usuario" onclick="irComoUsuario()">
      <span class="icono">👤</span>
      <span class="texto">
        Ingresar como Usuario
        <small>Crear y consultar mis PQRS</small>
      </span>
    </button>

    <button class="btn-rol btn-analista" onclick="irComoAnalistaDeNomina()">
      <span class="icono">🔍</span>
      <span class="texto">
        Ingresar como Analista
        <small>Panel de gestión – Nómina</small>
      </span>
    </button>

    <button class="btn-rol btn-encargado" onclick="irComoEncargado()">
      <span class="icono">⚙️</span>
      <span class="texto">
        Ingresar como Encargado
        <small>Panel de supervisión y cierre</small>
      </span>
    </button>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
